</style></head><body><header><a href="./">← Về ứng dụng</a><h1>Quét một mã · Mở một trải nghiệm</h1><p><b>HỌC MÀ VUI – ThayKhaiEdu</b><br>Chọn nội dung bạn yêu thích. Trên điện thoại, bấm “Trải nghiệm ngay”. Lần truy cập đầu cần Internet.</p><button onclick="print()">In bộ 8 mã · Mỗi mã một trang A4</button><p>Các mã dẫn đến bản web công khai. Nội dung mới cần được cập nhật lên bản web trước khi sử dụng tại gian hàng.</p></header><main class="grid" id="gallery"></main><script src="./qr-experiences.js"></script><script>hmvQr.items.forEach(function(x){var a=document.createElement('article');a.className='qr-poster';var img=document.createElement('img');img.src='./assets/qr/'+x.id+'-poster.svg';img.alt='Mã QR '+x.title;a.appendChild(img);var play=document.createElement('a');play.href='./#trai-nghiem/'+x.id;play.textContent='Trải nghiệm ngay';a.appendChild(play);var dl=document.createElement('a');dl.href=img.src;dl.download=x.id+'-ThayKhaiEdu.svg';dl.textContent='Tải ảnh SVG';a.appendChild(dl);document.getElementById('gallery').appendChild(a)});</script></body></html>
